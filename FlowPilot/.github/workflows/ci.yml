name: FlowPilot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Backend Lint & Build ─────────────────────────────────────────────────
  backend:
    name: Backend – Lint & TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FlowPilot/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: FlowPilot/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_test

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ─── Frontend Lint & Build ────────────────────────────────────────────────
  frontend:
    name: Frontend – Lint & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FlowPilot/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: FlowPilot/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

  # ─── Playwright E2E Tests ─────────────────────────────────────────────────
  e2e:
    name: E2E Tests – Playwright
    runs-on: ubuntu-latest
    needs: [frontend]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowpilot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./FlowPilot/backend

      - name: Run Prisma migrations
        run: npx prisma db push
        working-directory: ./FlowPilot/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_test

      - name: Seed database
        run: npx prisma db seed
        working-directory: ./FlowPilot/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_test

      - name: Start backend
        run: npx tsx src/app.ts &
        working-directory: ./FlowPilot/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flowpilot_test
          JWT_SECRET: test-jwt-secret
          PORT: 5000

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./FlowPilot/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./FlowPilot/frontend

      - name: Start frontend
        run: npm run dev &
        working-directory: ./FlowPilot/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

      - name: Wait for servers
        run: sleep 15

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: ./FlowPilot/frontend
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: FlowPilot/frontend/playwright-report/
          retention-days: 7
